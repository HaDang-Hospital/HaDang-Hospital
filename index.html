
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HaDang Hospital</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: sans-serif;
            color: #243447;
            margin: 0;
        }

        .navbar {
            background: white;
        }

        .navbar-brand {
            color: #1769aa;
            font-weight: bold;
            font-size: 25px;
        }

        .hero {
            background: #eaf4fc;
            min-height: 430px;
            display: flex;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            color: #164b78;
            font-size: 42px;
            font-weight: bold;
        }

        .hero p {
            color: #45657e;
            font-size: 19px;
            margin-top: 25px;
        }

        .section-title {
            color: #164b78;
            font-weight: bold;
        }

        .info-card {
            border: 0;
            border-radius: 15px;
            padding: 30px 15px;
            background: #f0f6fb;
            height: 100%;
            text-align: center;
        }

        .info-card h5 {
            color: #1769aa;
            font-weight: bold;
        }

        footer {
            background: #164b78;
            color: white;
            padding: 25px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- 상단 메뉴 -->
    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">HaDang Hospital</a>
        </div>
    </nav>

    <!-- 메인 화면 -->
    <section class="hero">
        <div class="container">
            <h1>환자 중심의 진료</h1>
            <p>건강한 내일을 함께합니다</p>
            <p>신뢰와 정성을 바탕으로 최선을 다하는 HaDang Hospital</p>
        </div>
    </section>

    <!-- 병원 소개 -->
    <section class="container py-5 text-center">
        <h2 class="section-title mb-3">HaDang Hospital</h2>
        <p>환자의 건강과 행복을 위해 정성을 다하는 병원입니다.</p>
    </section>

    <!-- 주요 안내 -->
    <section class="container pb-5">
        <h2 class="section-title text-center mb-4">병원 안내</h2>

        <div class="row g-4">

            <div class="col-md-3 col-6">
                <div class="info-card">
                    <h5>진료과목</h5>
                    <p>진료 안내</p>
                </div>
            </div>

            <div class="col-md-3 col-6">
                <div class="info-card">
                    <h5>의료진 소개</h5>
                    <p>의료진 안내</p>
                </div>
            </div>

            <div class="col-md-3 col-6">
                <div class="info-card">
                    <h5>진료시간</h5>
                    <p>진료 시간 안내</p>
                </div>
            </div>

            <div class="col-md-3 col-6">
                <div class="info-card">
                    <h5>오시는 길</h5>
                    <p>병원 위치 안내</p>
                </div>
            </div>

        </div>
    </section>

    <!-- 하단 -->
    <footer>
        <p class="mb-1">HaDang Hospital</p>
        <small>건강한 내일을 함께합니다.</small>
    </footer>

</body>
</html>
